confirm_os_window_close 0
copy_on_select yes

cursor_blink_interval 0.5
cursor_shape block
cursor_stop_blinking_after 15.0

enabled_layouts fat:bias=75;full_size=1;mirrored=false
initial_window_height 768
initial_window_width 1024
remember_window_size yes

mouse_map left click ungrabbed,grabbed mouse_select_command
scrollback_lines 10000
strip_trailing_spaces smart

hide_window_decorations titlebar-only

tab_bar_style                   custom
tab_separator                   ""
tab_fade                        0 0 0 0
tab_title_template              "{fmt.fg._415c6d}{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "
active_tab_title_template       "{fmt.fg._83b6af}{fmt.bg.default}  {index}:{f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 25 else title}{' []' if layout_name == 'stack' else ''} "
tab_bar_edge                    top
tab_bar_align                   left
tab_bar_margin_width            0.0
tab_bar_margin_height           10.0 0.0
active_tab_font_style           bold-italic
inactive_tab_font_style         normal
tab_bar_min_tabs                2
tab_activity_symbol             none
bell_on_tab                     no

url_style single
window_padding_width 10

visual_bell_duration 0.1
enable_audio_bell no

font_family JetBrains Mono
font_size 11.0

map ctrl+shift+alt+t set_tab_title
map ctrl+shift+enter launch --type=window --cwd=~
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+left previous_window
map ctrl+shift+n new_os_window
map ctrl+shift+o open_url_with_hints
map ctrl+shift+q close_tab
map ctrl+shift+right next_window
map ctrl+shift+t launch --type=tab --cwd=~
map ctrl+shift+w close_window
map alt+z send_text all \x1a

dynamic_background_opacity yes
background_opacity 0.70
map ctrl+shift+up set_background_opacity +0.1
map ctrl+shift+down set_background_opacity -0.1

macos_show_window_title_in all
macos_titlebar_color background
macos_option_as_alt left
map option+,

globinclude kitty.d/**/*.conf
