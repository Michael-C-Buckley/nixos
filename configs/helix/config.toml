theme = "ayu_evolve"

[editor]
line-number = "relative"
mouse = true
bufferline = "multiple"
cursorline = true
true-color = true
rulers = [120]
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "error"
other-lines = "disable"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
character = "╎"
render = true

[keys.normal]
"A-," = "goto_previous_buffer"
"A-." = "goto_next_buffer"
A-w = ":buffer-close"
A-x = "extend_to_line_bounds"
A-r = ":reload-all"
X = "select_line_above"
C-y = [
  ':sh rm -f /tmp/helix-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/helix-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
C-g = [
  ":write-all",
  ":insert-output lazygit >/dev/tty",
  ":redraw",
  ":reload-all",
]
C-r = [
  ":write-all",
  ":insert-output scooter --no-stdin >/dev/tty",
  ":redraw",
  ":reload-all",
]

[keys.select]
A-x = "extend_to_line_bounds"
X = "select_line_above"
