[all_follow]
nixpkgs = "nixpkgs"
crame = "crane"
rust-overlay = "rust-overlay"

[shorturls]
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
gh = "github:{path}"
mine = "github:michael-c-buckley/{path}"
comview = "https://github.com/rockorager/comview/releases/download/{tag}/comview_{version}_{path}.tar.gz"
tack = "https://github.com/manic-systems/tack/releases/download/{tag}/tack-linux-{path}"

[inputs]
nixpkgs.url = "nixpkgs:nixos-unstable"
adios-flake.url = "gh:mic92/adios-flake"
hjem.url = "gh:feel-co/hjem"
lanzaboote.url = "gh:nix-community/lanzaboote"
helium.url = "gh:amaanq/helium-flake"
finix.url = "gh:finix-community/finix"
nixos-core.url = "gh:manic-systems/nixos-core"
sops-nix.url = "gh:mic92/sops-nix"
agentbox.url = "mine:agentbox"
rexy.url = "mine:rexy"
helix.url = "gh:helix-editor/helix"

# This one is rather thick with or without the follow
# It does also break quite easily if following, and the
# same space difference is not worth it to me versus
# the maintenance overhead, for this one
[inputs.hermes]
url = "gh:NousResearch/hermes-agent"
exclude_follow = ["nixpkgs"]

# Zsh Plugins I use
[inputs.zsh-git-tab]
url = "mine:zsh-git-tab"
type = "fetch"

[inputs.zsh-transient-prompt]
url = "gh:olets/zsh-transient-prompt"
type = "fetch"

[inputs.fast-abbr-highlighting]
url = "gh:5A6F65/fast-abbr-highlighting"
type = "fetch"

[groups.comview]
type = "fixed"
unpack = "file"
tag = "v{version}"

[inputs.comview]
comview-aarch64-darwin.url = "comview:darwin_arm64"
comview-aarch64-linux.url = "comview:linux_arm64"
comview-x86_64-linux.url = "comview:linux_amd64"

[groups.tack]
type = "fixed"
unpack = "file"
tag = "v{version}"

[inputs.tack]
tack-aarch64-linux.url = "tack:arm64"
tack-x86_64-linux.url = "tack:amd64"


[tack]
recomposable = true
